<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Palette Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffe2eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 1300px;
            max-width: 90%;
            padding: 50px;
            border-radius: 15px;
            background: #ffffff;
            color: black;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

        h1 {
            color: #b94f75;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9e6479;
            margin-bottom: 25px;
        }

        #generate-btn {
            background-color: #d96b91;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        #generate-btn:hover {
            background-color: #bd5279;
            transform: scale(1.05);
        }

        .palette {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            box-shadow: 0 5px 15px rgba(185, 79, 117, 0.12);
        }

        .color-card {
            cursor: pointer;
            transition: 0.2s;
        }

        .color-card:hover {
            transform: translateY(-5px);
        }

        .color-box {
            height: 180px;
            background-color: #F4A7BB;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .color-code {
            color: #9e6479;
            font-weight: bold;
            font-size: 14px;
        }

        .copy-text {
            color: #c18a9e;
            font-size: 11px;
            margin-top: 5px;
        }

        #message {
            color: #b94f75;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
        }

        .tip {
            color: #9e6479;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .palette {
                grid-template-columns: repeat(2, 1fr);
            }

            .color-box {
                height: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>*ੈ✩‧₊˚Random Color Palette*ੈ✩‧₊˚</h1>
        <p class="subtitle">
            Discover beautiful colors for your next project!
        </p>

        <button id="generate-btn">⋅˚₊‧ ୨୧Generate Palette୨୧ ‧₊˚ ⋅</button>

        <div class="palette">

            <div class="color-card">
                <div class="color-box" style="background-color: #F4A7BB;"></div>
                <p class="color-code">#F4A7BB</p>
                <p class="copy-text">♡ Click to copy</p>
            </div>

            <div class="color-card">
                <div class="color-box" style="background-color: #F8C8DC;"></div>
                <p class="color-code">#F8C8DC</p>
                <p class="copy-text">♡ Click to copy</p>
            </div>

            <div class="color-card">
                <div class="color-box" style="background-color: #E6A4B4;"></div>
                <p class="color-code">#E6A4B4</p>
                <p class="copy-text">♡ Click to copy</p>
            </div>

            <div class="color-card">
                <div class="color-box" style="background-color: #C97C91;"></div>
                <p class="color-code">#C97C91</p>
                <p class="copy-text">♡ Click to copy</p>
            </div>

            <div class="color-card">
                <div class="color-box" style="background-color: #9E6479;"></div>
                <p class="color-code">#9E6479</p>
                <p class="copy-text">♡ Click to copy</p>
            </div>

        </div>

        <p id="message"></p>

        <p class="tip">
            💡 Tip: Click any color card to copy its HEX code!
        </p>

    </div>

    <script>

        // Get the button and color cards
        const generateBtn = document.getElementById("generate-btn");
        const colorCards = document.querySelectorAll(".color-card");
        const message = document.getElementById("message");


        // Generate a random HEX color
        function generateRandomColor() {

            const randomNumber = Math.floor(Math.random() * 16777216);

            const hexColor = "#" + randomNumber
                .toString(16)
                .padStart(6, "0");

            return hexColor.toUpperCase();
        }


        // Generate a new color palette
        function generatePalette() {

            colorCards.forEach(function(card) {

                const color = generateRandomColor();

                const colorBox = card.querySelector(".color-box");
                const colorCode = card.querySelector(".color-code");

                colorBox.style.backgroundColor = color;
                colorCode.textContent = color;

            });

            message.textContent = "New color palette generated!";

        }


        // Generate colors when the button is clicked
        generateBtn.addEventListener("click", generatePalette);


        // Copy the HEX code when a color card is clicked
        colorCards.forEach(function(card) {

            card.addEventListener("click", function() {

                const colorCode = card.querySelector(".color-code").textContent;

                navigator.clipboard.writeText(colorCode)
                    .then(function() {

                        message.textContent = "♡ " + colorCode + " copied to clipboard!";

                    })
                    .catch(function() {

                        message.textContent = "Unable to copy. Please try again.";

                    });

            });

        });

    </script>

</body>
</html>
